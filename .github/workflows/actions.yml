name: actions
on: [push, pull_request]
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            grpc/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: grpc
          args: --timeout=5m
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          check-latest: true
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            grpc/go.sum
      - name: Test root module
        run: go test -v ./...
      - name: Test gRPC module
        working-directory: grpc
        run: go test -v ./...
